# 千寻：每次 PR 与合并到 main 时自动检查（引擎＋搜索测试、Windows 原生版编译）
name: qianxun-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, current]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装完整回归依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          pip install PyQt5==5.15.11 PySide6_Essentials==6.8.0.2
      - name: 运行完整 Linux 回归并保留各项退出码
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          bash tests/run_regression.sh /tmp/qianxun-regression || true
          python - <<'PY'
          from pathlib import Path
          logs = list(Path('/tmp/qianxun-regression').glob('*.log'))
          assert logs, 'No regression logs produced'
          failed = []
          for p in sorted(logs):
              text = p.read_text(errors='replace')
              rc = [s for s in text.splitlines() if s.startswith('rc=')]
              print(p.name, rc[-1:] or ['missing rc'])
              # Existing documented PySide6 interpreter teardown issue.
              known = p.name == 'gui_PySide6.log' and 'GUI FAILED: none' in text and rc[-1:] == ['rc=139']
              if rc[-1:] != ['rc=0'] and not known:
                  failed.append(p.name)
          assert not failed, failed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-regression-${{ matrix.revision }}
          path: /tmp/qianxun-regression

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 语法检查
        run: python -m py_compile app/qianxun.py
      - name: 引擎测试
        run: |
          cd tests/qa
          timeout 600 python test_engine.py | tee ../../engine.log
          grep -q "^FAILED: none" ../../engine.log
      - name: 搜索语法测试
        run: |
          cd tests/qa
          timeout 600 python test_search.py | tee ../../search.log
          grep -q "TOTAL FAIL 0" ../../search.log
      - name: 内存结构与补扫节流测试
        run: |
          python tests/qa/test_resources.py
          python tests/qa/test_reclaim_live.py
          python tests/win/test_taskbar_identity.py
      - name: 安装界面测试依赖
        run: pip install PyQt5==5.15.11 PySide6_Essentials==6.8.0.2
      - name: 后台搜索与按需显示测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          QIANXUN_QT=PyQt5 python tests/qa/test_async_search.py
          QIANXUN_QT=PySide6 python tests/qa/test_async_search.py

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64 g++-mingw-w64-x86-64-win32 g++-mingw-w64-i686-win32
      - name: 编译原生版 x64／x86
        run: bash native/build.sh
      - name: 编译带应用身份的 Windows 启动器
        run: |
          mkdir -p _work/launcher
          cd build/windows/launcher
          x86_64-w64-mingw32-windres -c 65001 -O coff launcher.rc -o ../../../_work/launcher/res.o
          x86_64-w64-mingw32-gcc -municode -mwindows -O2 -s -Wall -static launcher.c ../../../_work/launcher/res.o -lole32 -luuid -lshell32 -o ../../../_work/launcher/QianXun.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: _work/launcher/QianXun.exe
      - name: 核查导入表（须兼容 Windows 7）
        run: |
          for a in x64 x86; do
            out=$(bash tests/native_diff/check_imports.sh native/out/QianXun-$a.exe); echo "$out"
            echo "$out" | grep -q "OUTSIDE-SPEC-LIST" && { echo "::error::$a 导入了规定以外的 DLL"; exit 1; }
            echo "$out" | grep -A1 "suspicious" | grep -q "^  none$" || { echo "::error::$a 存在 Win8+ 才有的静态导入"; exit 1; }
          done
